<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="rainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="croissantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" rx="16" fill="url(#rainBg)"/>

  <!-- Warm Cafe Window Glow -->
  <circle cx="280" cy="160" r="180" fill="url(#warmLight)"/>

  <!-- Rain Streaks (Cozy Ambiance) -->
  <g stroke="#38BDF8" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round">
    <line x1="80" y1="40" x2="60" y2="90" />
    <line x1="150" y1="20" x2="130" y2="70" />
    <line x1="220" y1="50" x2="200" y2="100" />
    <line x1="110" y1="120" x2="90" y2="170" />
    <line x1="180" y1="140" x2="160" y2="190" />
    <line x1="680" y1="30" x2="660" y2="80" />
    <line x1="740" y1="60" x2="720" y2="110" />
    <line x1="620" y1="70" x2="600" y2="120" />
    <line x1="710" y1="130" x2="690" y2="180" />
    <line x1="650" y1="160" x2="630" y2="210" />
  </g>

  <!-- Cafe Counter / Wooden Table -->
  <path d="M 0 230 L 800 230 L 800 320 L 0 320 Z" fill="#292524" />
  <line x1="0" y1="230" x2="800" y2="230" stroke="#78350F" stroke-width="4"/>
  <rect x="0" y="234" width="800" height="12" fill="#451A03" opacity="0.6"/>

  <!-- Steaming Coffee Cup -->
  <g transform="translate(180, 150)">
    <!-- Steam -->
    <path d="M 30 -5 Q 25 -25 35 -40" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M 45 -10 Q 55 -28 45 -45" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
    <!-- Mug Body -->
    <rect x="15" y="0" width="50" height="60" rx="8" fill="#F8FAFC"/>
    <!-- Mug Handle -->
    <path d="M 65 15 C 80 15, 80 45, 65 45" fill="none" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round"/>
    <!-- Coffee -->
    <ellipse cx="40" cy="5" rx="22" ry="6" fill="#78350F"/>
    <!-- Saucer -->
    <ellipse cx="40" cy="62" rx="35" ry="6" fill="#CBD5E1"/>
  </g>

  <!-- Fresh Basil Salt Bread (Croissant) -->
  <g transform="translate(290, 160)">
    <!-- Plate -->
    <ellipse cx="75" cy="55" rx="85" ry="22" fill="#F1F5F9" opacity="0.9"/>
    <ellipse cx="75" cy="53" rx="75" ry="18" fill="#E2E8F0"/>
    <!-- Bread Body -->
    <path d="M 20 40 C 35 10, 115 10, 130 40 C 120 55, 30 55, 20 40 Z" fill="url(#croissantGrad)" filter="url(#glow)"/>
    <!-- Crust details -->
    <path d="M 45 22 C 60 18, 90 18, 105 22" stroke="#FEF3C7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Salt grains -->
    <circle cx="65" cy="28" r="2" fill="#FFFFFF"/>
    <circle cx="78" cy="25" r="2.5" fill="#FFFFFF"/>
    <circle cx="90" cy="29" r="2" fill="#FFFFFF"/>
    <!-- Fresh Basil Leaf -->
    <path d="M 75 20 Q 82 10 92 14 Q 85 24 75 20 Z" fill="#10B981"/>
  </g>

  <!-- Right Floating Value & Callout Card -->
  <g transform="translate(470, 45)">
    <!-- Card Frame -->
    <rect width="300" height="230" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5" filter="url(#glow)"/>

    <!-- Urgent Flash Badge -->
    <rect x="20" y="20" width="160" height="28" rx="8" fill="url(#tagGrad)"/>
    <text x="32" y="38" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-weight="900" font-size="12">⚡ 3시간 한정 번개특가</text>

    <!-- Main Headline -->
    <text x="20" y="78" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-weight="900" font-size="18">따뜻한 소금빵 세트</text>
    <text x="20" y="102" fill="#FCD34D" font-family="'Pretendard', sans-serif" font-weight="800" font-size="15">3,000원 즉시 할인권</text>

    <!-- Context note -->
    <rect x="20" y="118" width="260" height="42" rx="8" fill="#1E293B"/>
    <text x="30" y="135" fill="#94A3B8" font-family="'Pretendard', sans-serif" font-weight="700" font-size="11">🌧️ 성수동 실내 아늑 소비 탄력도</text>
    <text x="30" y="150" fill="#38BDF8" font-family="'Pretendard', sans-serif" font-weight="900" font-size="12">+35% 급증 구간 실시간 포획</text>

    <!-- Expected Gain Button -->
    <rect x="20" y="172" width="260" height="42" rx="10" fill="url(#badgeGrad)"/>
    <text x="75" y="198" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-weight="900" font-size="14">예상 추가 수익 +₩240,000</text>
  </g>

  <!-- Floating Weather Pill Top Left -->
  <g transform="translate(30, 24)">
    <rect width="210" height="34" rx="17" fill="rgba(15, 23, 42, 0.85)" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="18" y="22" fill="#38BDF8" font-family="'Pretendard', sans-serif" font-weight="900" font-size="12">🌧️ 비 내림 (5.2mm) 실시간 감지</text>
  </g>
</svg>
