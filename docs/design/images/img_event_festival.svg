<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="festBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="60%" stop-color="#022C22"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="festSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#84CC16" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="400" height="200" rx="14" fill="url(#festBg)"/>
  <circle cx="200" cy="80" r="120" fill="url(#festSun)"/>

  <!-- Stylized Green Trees (Seoul Forest) -->
  <g fill="#059669" opacity="0.7">
    <circle cx="60" cy="120" r="35"/>
    <circle cx="110" cy="110" r="45"/>
    <circle cx="290" cy="115" r="40"/>
    <circle cx="340" cy="125" r="30"/>
  </g>

  <!-- Picnic Mat & Takeout Coffee -->
  <polygon points="130,175 270,175 250,145 150,145" fill="#F43F5E" opacity="0.85"/>
  <rect x="185" y="130" width="18" height="26" rx="4" fill="#FFFFFF"/>
  <rect x="183" y="126" width="22" height="5" rx="2" fill="#0284C7"/>
  <line x1="194" y1="126" x2="198" y2="114" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>

  <!-- Festive Confetti Sparkles -->
  <circle cx="80" cy="50" r="4" fill="#FBBF24"/>
  <circle cx="150" cy="40" r="3" fill="#EC4899"/>
  <circle cx="250" cy="45" r="4" fill="#38BDF8"/>
  <circle cx="320" cy="60" r="3.5" fill="#A7F3D0"/>

  <!-- Top Badge -->
  <rect x="16" y="16" width="140" height="26" rx="6" fill="rgba(16, 185, 129, 0.25)" stroke="#10B981" stroke-width="1"/>
  <text x="24" y="33" fill="#34D399" font-family="'Pretendard', sans-serif" font-weight="900" font-size="11">🎪 지역 축제 인파 감지</text>

  <!-- Title & Surge Text -->
  <text x="16" y="78" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-weight="900" font-size="17">서울숲 피크닉 피크 인파</text>
  <text x="16" y="100" fill="#FDE047" font-family="'Pretendard', sans-serif" font-weight="800" font-size="13">테이크아웃 2종 세트 프로모션</text>

  <!-- Foot Traffic Surge Metric -->
  <rect x="16" y="145" width="120" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="26" y="162" fill="#94A3B8" font-family="'Pretendard', sans-serif" font-weight="700" font-size="9">유동인구 급증</text>
  <text x="26" y="176" fill="#34D399" font-family="'Pretendard', sans-serif" font-weight="900" font-size="13">+35% 낙수</text>

  <rect x="265" y="145" width="120" height="38" rx="8" fill="#047857"/>
  <text x="278" y="168" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-weight="900" font-size="12">회수 +48만 원 ➔</text>
</svg>
