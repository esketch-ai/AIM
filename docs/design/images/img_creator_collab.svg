<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="creatorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="60%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="reelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="400" height="200" rx="14" fill="url(#creatorBg)"/>

  <!-- Phone Mockup Frame on Right -->
  <g transform="translate(265, 15)">
    <rect width="115" height="170" rx="14" fill="#000000" stroke="#6366F1" stroke-width="2"/>
    <!-- Screen -->
    <rect x="6" y="6" width="103" height="158" rx="10" fill="#18181B"/>
    <!-- Reel Video Preview Silhouette (Dessert) -->
    <circle cx="57" cy="70" r="28" fill="#F59E0B" opacity="0.8"/>
    <polygon points="52,60 68,70 52,80" fill="#FFFFFF"/>
    <!-- Top Progress Bar 15s -->
    <rect x="12" y="14" width="91" height="3" rx="1.5" fill="#52525B"/>
    <rect x="12" y="14" width="55" height="3" rx="1.5" fill="#FFFFFF"/>
    <!-- Heart & Share Icons -->
    <circle cx="95" cy="100" r="6" fill="#F43F5E"/>
    <circle cx="95" cy="118" r="6" fill="#FFFFFF" opacity="0.6"/>
    <!-- Creator Handle -->
    <text x="12" y="145" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-weight="800" font-size="8">@eunji_dessert</text>
    <text x="12" y="156" fill="#A1A1AA" font-family="'Pretendard', sans-serif" font-weight="600" font-size="7">#성수동베이커리 #소금빵</text>
  </g>

  <!-- Left Content -->
  <g transform="translate(20, 20)">
    <rect width="145" height="24" rx="6" fill="rgba(244, 63, 94, 0.2)" stroke="#F43F5E" stroke-width="1"/>
    <text x="10" y="16" fill="#FB7185" font-family="'Pretendard', sans-serif" font-weight="900" font-size="11">🎬 15초 숏폼 크리에이터 섭외</text>

    <text x="0" y="58" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-weight="900" font-size="16">디저트 전문 인플루언서</text>
    <text x="0" y="78" fill="#C084FC" font-family="'Pretendard', sans-serif" font-weight="800" font-size="13">3단 스토리보드 & 제안서 완성</text>

    <!-- Escrow Safety Pill -->
    <rect x="0" y="98" width="180" height="26" rx="6" fill="rgba(99, 102, 241, 0.25)" stroke="#6366F1" stroke-width="1"/>
    <text x="8" y="115" fill="#A5B4FC" font-family="'Pretendard', sans-serif" font-weight="800" font-size="10">🛡️ 100% 에스크로 안전 정산 보증</text>

    <!-- Gain Button -->
    <rect x="0" y="132" width="150" height="34" rx="8" fill="url(#reelGrad)"/>
    <text x="24" y="153" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-weight="900" font-size="12">회수 +85만 원 ➔</text>
  </g>
</svg>
