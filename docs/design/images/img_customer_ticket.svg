<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" height="100%">
  <defs>
    <linearGradient id="ticketBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="scanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="1"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Left: Ticket Body -->
  <g transform="translate(10, 10)">
    <rect width="280" height="200" rx="16" fill="url(#ticketBg)" stroke="#334155" stroke-width="2"/>
    
    <!-- Cutout Notches on Top and Bottom -->
    <circle cx="210" cy="0" r="10" fill="#070A12"/>
    <circle cx="210" cy="200" r="10" fill="#070A12"/>
    <line x1="210" y1="12" x2="210" y2="188" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Left Brand Section -->
    <rect x="20" y="20" width="100" height="24" rx="6" fill="#1E1B4B" stroke="#6366F1" stroke-width="1"/>
    <text x="28" y="36" fill="#A5B4FC" font-family="'Pretendard', sans-serif" font-weight="900" font-size="10">성수 아뜰리에</text>

    <text x="20" y="70" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-weight="900" font-size="15">비 오는 날 번개 특가권</text>
    
    <!-- Big Discount Number -->
    <text x="20" y="112" fill="#38BDF8" font-family="'Pretendard', sans-serif" font-weight="900" font-size="28">₩3,000</text>
    <text x="145" y="110" fill="#94A3B8" font-family="'Pretendard', sans-serif" font-weight="800" font-size="12">즉시 할인</text>

    <!-- Expiry Timer Pill -->
    <rect x="20" y="130" width="165" height="24" rx="6" fill="rgba(245, 158, 11, 0.15)"/>
    <text x="28" y="146" fill="#FCD34D" font-family="'Pretendard', sans-serif" font-weight="800" font-size="10">⏱️ 유효시간 02:49:15 남음</text>

    <!-- Right Barcode Section -->
    <g transform="translate(225, 25)">
      <!-- Barcode Bars -->
      <g fill="#FFFFFF">
        <rect x="0" y="0" width="2" height="110"/>
        <rect x="5" y="0" width="4" height="110"/>
        <rect x="12" y="0" width="2" height="110"/>
        <rect x="17" y="0" width="5" height="110"/>
        <rect x="25" y="0" width="1" height="110"/>
        <rect x="29" y="0" width="4" height="110"/>
        <rect x="36" y="0" width="3" height="110"/>
        <rect x="42" y="0" width="2" height="110"/>
      </g>
      <!-- Green Scanning Line -->
      <line x1="-5" y1="55" x2="49" y2="55" stroke="url(#scanGlow)" stroke-width="4"/>
      <text x="-4" y="135" fill="#10B981" font-family="'Pretendard', sans-serif" font-weight="900" font-size="9">POS 스캔 대기</text>
      <text x="-4" y="148" fill="#64748B" font-family="'Pretendard', sans-serif" font-weight="700" font-size="8">AIM-RAIN24K</text>
    </g>
  </g>

  <!-- Right: In-Store Action Visual Preview -->
  <g transform="translate(310, 20)">
    <rect width="180" height="180" rx="14" fill="#0A0F1D" stroke="#1E293B" stroke-width="1.5"/>
    <text x="18" y="32" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-weight="900" font-size="13">매장 카운터 실측 동작</text>
    
    <g transform="translate(18, 48)">
      <circle cx="16" cy="16" r="14" fill="rgba(16, 185, 129, 0.2)"/>
      <text x="11" y="21" fill="#10B981" font-weight="900" font-size="14">1</text>
      <text x="38" y="14" fill="#E2E8F0" font-family="'Pretendard', sans-serif" font-weight="800" font-size="11">손님이 폰 바코드 제시</text>
      <text x="38" y="26" fill="#94A3B8" font-family="'Pretendard', sans-serif" font-weight="600" font-size="9">카카오 알림톡/링크에서 열기</text>
    </g>

    <g transform="translate(18, 92)">
      <circle cx="16" cy="16" r="14" fill="rgba(56, 189, 248, 0.2)"/>
      <text x="11" y="21" fill="#38BDF8" font-weight="900" font-size="14">2</text>
      <text x="38" y="14" fill="#E2E8F0" font-family="'Pretendard', sans-serif" font-weight="800" font-size="11">POS 리더기 1초 스캔</text>
      <text x="38" y="26" fill="#94A3B8" font-family="'Pretendard', sans-serif" font-weight="600" font-size="9">3,000원 즉시 결제 할인</text>
    </g>

    <g transform="translate(18, 136)">
      <circle cx="16" cy="16" r="14" fill="rgba(245, 158, 11, 0.2)"/>
      <text x="11" y="21" fill="#F59E0B" font-weight="900" font-size="14">3</text>
      <text x="38" y="14" fill="#FDE047" font-family="'Pretendard', sans-serif" font-weight="800" font-size="11">통장 실측 매출 귀속</text>
      <text x="38" y="26" fill="#94A3B8" font-family="'Pretendard', sans-serif" font-weight="600" font-size="9">+24,000원 결제 완료</text>
    </g>
  </g>
</svg>
