<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%" style="border-radius: 16px; background: linear-gradient(135deg, #090D1A 0%, #111827 100%); font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;">
  <defs>
    <linearGradient id="glowCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title Pill Header -->
  <g transform="translate(30, 24)">
    <rect width="210" height="26" rx="13" fill="#1E1B4B" stroke="#4338CA" stroke-width="1"/>
    <text x="12" y="17" fill="#A5B4FC" font-size="11" font-weight="800">⚡ 사장님이 할 일은 딱 1번의 터치</text>
  </g>
  <text x="250" y="42" fill="#94A3B8" font-size="12">글 읽을 필요 없이 1 ➔ 2 ➔ 3단계로 오늘 순이익이 바로 찍힙니다</text>

  <!-- STEP 1: Weather Sense -->
  <g transform="translate(30, 65)" filter="url(#shadow)">
    <rect width="250" height="145" rx="14" fill="url(#glowCard)" stroke="#334155" stroke-width="1.5"/>
    <rect x="16" y="16" width="34" height="34" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="24" y="39" font-size="18">🌧️</text>
    <text x="60" y="30" fill="#38BDF8" font-size="11" font-weight="800">STEP 1. AI 실시간 감지</text>
    <text x="60" y="46" fill="#F8FAFC" font-size="14" font-weight="900">비·한산한 시간 포착</text>
    <line x1="16" y1="62" x2="234" y2="62" stroke="#334155" stroke-dasharray="3 3"/>
    <text x="16" y="85" fill="#94A3B8" font-size="12">"성수동 비 5.2mm 예보"</text>
    <text x="16" y="105" fill="#CBD5E1" font-size="12" font-weight="700">빈 테이블 채울 3시간 한정</text>
    <rect x="16" y="118" width="130" height="20" rx="4" fill="#0369A1" fill-opacity="0.3"/>
    <text x="22" y="132" fill="#7DD3FC" font-size="10" font-weight="800">번개 할인 플랜 자동 기안</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(290, 130)">
    <circle cx="10" cy="0" r="14" fill="#1E293B" stroke="#475569"/>
    <path d="M 6 -5 L 14 0 L 6 5" fill="none" stroke="#FCD34D" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- STEP 2: 1-Touch Approve -->
  <g transform="translate(325, 65)" filter="url(#shadow)">
    <rect width="250" height="145" rx="14" fill="url(#glowCard)" stroke="#10B981" stroke-width="2"/>
    <rect x="16" y="16" width="34" height="34" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="24" y="39" font-size="18">👆</text>
    <text x="60" y="30" fill="#34D399" font-size="11" font-weight="800">STEP 2. 사장님이 할 일</text>
    <text x="60" y="46" fill="#FFFFFF" font-size="14" font-weight="900">단 1초 승인 터치 (끝!)</text>
    <line x1="16" y1="62" x2="234" y2="62" stroke="#334155" stroke-dasharray="3 3"/>
    <!-- Button Graphic -->
    <rect x="16" y="76" width="218" height="42" rx="8" fill="url(#accentGreen)"/>
    <text x="45" y="102" fill="#FFFFFF" font-size="13" font-weight="900">⚡ 1초 승인 송출하기</text>
    <text x="16" y="134" fill="#A7F3D0" font-size="11" font-weight="700">카카오·인스타·블로그 즉시 동시 발송</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(585, 130)">
    <circle cx="10" cy="0" r="14" fill="#1E293B" stroke="#475569"/>
    <path d="M 6 -5 L 14 0 L 6 5" fill="none" stroke="#FCD34D" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- STEP 3: Net Revenue Benefit -->
  <g transform="translate(620, 65)" filter="url(#shadow)">
    <rect width="250" height="145" rx="14" fill="url(#glowCard)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="16" y="16" width="34" height="34" rx="10" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
    <text x="24" y="39" font-size="18">💰</text>
    <text x="60" y="30" fill="#FCD34D" font-size="11" font-weight="800">STEP 3. 내가 얻는 효과</text>
    <text x="60" y="46" fill="#FCD34D" font-size="14" font-weight="900">POS 실매출 1원 단위 정산</text>
    <line x1="16" y1="62" x2="234" y2="62" stroke="#334155" stroke-dasharray="3 3"/>
    <text x="16" y="85" fill="#CBD5E1" font-size="11">손님 15명 방문 바코드 결제</text>
    <text x="16" y="112" fill="#38BDF8" font-size="20" font-weight="900">+₩213,600</text>
    <text x="145" y="112" fill="#34D399" font-size="11" font-weight="800">(순이익 입증)</text>
    <text x="16" y="132" fill="#94A3B8" font-size="10">구독료 49,000원 대비 순이익 ROI +2,446%</text>
  </g>
</svg>
