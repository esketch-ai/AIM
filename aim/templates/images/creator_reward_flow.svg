<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%" style="border-radius: 16px; background: linear-gradient(135deg, #0F172A 0%, #1E1B4B 100%); font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title Pill Header -->
  <g transform="translate(30, 24)">
    <rect width="240" height="26" rx="13" fill="#831843" stroke="#DB2777" stroke-width="1"/>
    <text x="12" y="17" fill="#FCE7F3" font-size="11" font-weight="800">🎬 크리에이터: 15초 숏폼으로 투명 정산</text>
  </g>
  <text x="280" y="42" fill="#94A3B8" font-size="12">영상 올리고 내 바코드 링크만 공유하면 실매출 발생 시 3% 즉시 정산</text>

  <!-- STEP 1: Shortform Creation -->
  <g transform="translate(30, 65)" filter="url(#shadow)">
    <rect width="250" height="145" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <rect x="16" y="16" width="34" height="34" rx="10" fill="#831843" stroke="#F43F5E" stroke-width="1"/>
    <text x="24" y="39" font-size="18">🎬</text>
    <text x="60" y="30" fill="#FB7185" font-size="11" font-weight="800">STEP 1. 15초 영상 제작</text>
    <text x="60" y="46" fill="#FFFFFF" font-size="14" font-weight="900">숏폼 콘티 & 링크 탑재</text>
    <line x1="16" y1="62" x2="234" y2="62" stroke="#334155" stroke-dasharray="3 3"/>
    <text x="16" y="85" fill="#CBD5E1" font-size="12">AI 콘티 기반 15초 영상 제작</text>
    <text x="16" y="105" fill="#F472B6" font-size="12" font-weight="700">본문 aim.link/c/cr02 삽입</text>
    <rect x="16" y="118" width="130" height="20" rx="4" fill="#BE185D" fill-opacity="0.3"/>
    <text x="22" y="132" fill="#FBCFE8" font-size="10" font-weight="800">팔로워 전용 3,000원 쿠폰</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(290, 130)">
    <circle cx="10" cy="0" r="14" fill="#1E293B" stroke="#475569"/>
    <path d="M 6 -5 L 14 0 L 6 5" fill="none" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- STEP 2: Escrow Trust -->
  <g transform="translate(325, 65)" filter="url(#shadow)">
    <rect width="250" height="145" rx="14" fill="#0F172A" stroke="#6366F1" stroke-width="2"/>
    <rect x="16" y="16" width="34" height="34" rx="10" fill="#312E81" stroke="#818CF8" stroke-width="1"/>
    <text x="24" y="39" font-size="18">🛡️</text>
    <text x="60" y="30" fill="#A5B4FC" font-size="11" font-weight="800">STEP 2. 안전 에스크로</text>
    <text x="60" y="46" fill="#FFFFFF" font-size="14" font-weight="900">정산 떼임 리스크 0%</text>
    <line x1="16" y1="62" x2="234" y2="62" stroke="#334155" stroke-dasharray="3 3"/>
    <text x="16" y="85" fill="#CBD5E1" font-size="11">플랫폼 안전 금고(에스크로)에</text>
    <text x="16" y="105" fill="#818CF8" font-size="12" font-weight="700">보너스 예치금 사전 락인</text>
    <rect x="16" y="118" width="140" height="20" rx="4" fill="#4338CA" fill-opacity="0.3"/>
    <text x="22" y="132" fill="#C7D2FE" font-size="10" font-weight="800">실적 발생 즉시 자동 언락</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(585, 130)">
    <circle cx="10" cy="0" r="14" fill="#1E293B" stroke="#475569"/>
    <path d="M 6 -5 L 14 0 L 6 5" fill="none" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- STEP 3: Realtime 3% Commission -->
  <g transform="translate(620, 65)" filter="url(#shadow)">
    <rect width="250" height="145" rx="14" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <rect x="16" y="16" width="34" height="34" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="24" y="39" font-size="18">💵</text>
    <text x="60" y="30" fill="#34D399" font-size="11" font-weight="800">STEP 3. 결제당 3% 즉시 수령</text>
    <text x="60" y="46" fill="#34D399" font-size="14" font-weight="900">1건당 720원~1,500원</text>
    <line x1="16" y1="62" x2="234" y2="62" stroke="#334155" stroke-dasharray="3 3"/>
    <text x="16" y="85" fill="#CBD5E1" font-size="11">내 쿠폰 스캔 시마다 실시간 누적</text>
    <text x="16" y="112" fill="#38BDF8" font-size="20" font-weight="900">+₩720/건</text>
    <text x="145" y="112" fill="#FCD34D" font-size="11" font-weight="800">(에스크로 입금)</text>
    <text x="16" y="132" fill="#94A3B8" font-size="10">투명한 대시보드로 1원 단위 내역 확인</text>
  </g>
</svg>
